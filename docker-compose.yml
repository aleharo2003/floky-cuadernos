# Local development: database, API and portal with hot reload.
# Portal: http://localhost:5173  API and admin: http://localhost:8000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cuadernos
      POSTGRES_USER: cuadernos
      POSTGRES_PASSWORD: cuadernos
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cuadernos"]
      interval: 3s
      retries: 20

  api:
    image: python:3.13-slim
    working_dir: /app/backend
    command: sh -c "pip install -q -r requirements-dev.txt && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SECRET_KEY: dev-only-not-secret
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,api"
      DJANGO_CSRF_TRUSTED_ORIGINS: "http://localhost:5173"
      DJANGO_SECURE_SSL_REDIRECT: "0"
      DATABASE_URL: postgres://cuadernos:cuadernos@db:5432/cuadernos
    volumes: [".:/app", "pip-cache:/root/.cache/pip"]
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  portal:
    image: node:22-alpine
    working_dir: /app/frontend
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_TARGET: http://api:8000
    volumes: [".:/app", "/app/frontend/node_modules"]
    ports: ["5173:5173"]
    depends_on: [api]

volumes:
  db-data:
  pip-cache:
