[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# E/F: errores, I: orden de imports, B: bugs comunes, S: seguridad (ADR-0005), DJ: Django, UP: sintaxis moderna
select = ["E", "F", "I", "B", "S", "DJ", "UP"]

[tool.ruff.lint.per-file-ignores]
# assert es la forma normal de escribir tests con pytest
"tests/*" = ["S101"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "--strict-markers"
filterwarnings = ["ignore:No directory at:UserWarning"]
