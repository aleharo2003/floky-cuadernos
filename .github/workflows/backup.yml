# Nightly backup of the production database (HU-016, OPS-01).
#
# pg_dump -> encrypted with age for two keys (team and owner; public keys only,
# the private keys never touch GitHub) -> uploaded to a Cloud Storage bucket in the
# owner's Google Cloud project. The database lives in Neon, so the copy is with another provider.
# Retention is a lifecycle rule on the bucket (tools/gcp_backup_setup.sh).
#
# If it fails, GitHub emails whoever last changed this file. Check the Actions tab weekly.
name: Backup

on:
  schedule:
    - cron: "17 6 * * *" # 03:17 in Argentina, when nobody is loading entries
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # to log in to Google Cloud without key files

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    # Skipped until the backup variables are set (docs/operacion/backups.md).
    if: vars.GCS_BACKUP_BUCKET != '' && vars.BACKUP_AGE_RECIPIENTS != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: backup
    env:
      PG_MAJOR: ${{ vars.PG_MAJOR || '18' }}
    steps:
      - name: Install the PostgreSQL client and age
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-${PG_MAJOR}" age
          echo "/usr/lib/postgresql/${PG_MAJOR}/bin" >> "$GITHUB_PATH"

      - name: Dump and encrypt
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          # Public keys separated by spaces: the team key and the owner key.
          AGE_RECIPIENTS: ${{ vars.BACKUP_AGE_RECIPIENTS }}
        run: |
          set -euo pipefail
          args=()
          keys=0
          for key in $AGE_RECIPIENTS; do args+=(--recipient "$key"); keys=$((keys + 1)); done
          if [ "$keys" -lt 2 ]; then
            echo "BACKUP_AGE_RECIPIENTS needs two keys (team and owner), separated by a space." >&2
            exit 1
          fi
          name="cuadernos-$(date -u +%Y%m%d-%H%M%S).dump.age"
          pg_dump --format=custom --no-owner --no-privileges "$DATABASE_URL" \
            | age "${args[@]}" > "$name"
          size=$(stat -c %s "$name")
          if [ "$size" -lt 1024 ]; then echo "The backup is too small ($size bytes)." >&2; exit 1; fi
          echo "FILE=$name" >> "$GITHUB_ENV"
          echo "Backup $name, $size bytes, encrypted for $keys keys" >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          token_format: access_token

      - name: Upload to Cloud Storage
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          BUCKET: ${{ vars.GCS_BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          size=$(stat -c %s "$FILE")
          # ifGenerationMatch=0: never overwrite an existing backup.
          # The service account can only create objects in this bucket, not read or delete them.
          response=$(curl -fsS -X POST --data-binary @"$FILE" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/octet-stream" \
            "https://storage.googleapis.com/upload/storage/v1/b/${BUCKET}/o?uploadType=media&ifGenerationMatch=0&name=daily%2F${FILE}")
          # Check what Cloud Storage says it stored: an upload we cannot confirm does not count.
          stored=$(echo "$response" | jq -r '.size')
          if [ "$stored" != "$size" ]; then
            echo "Cloud Storage stored $stored bytes, expected $size." >&2
            exit 1
          fi
          echo "Uploaded to gs://${BUCKET}/daily/${FILE}" >> "$GITHUB_STEP_SUMMARY"
