# Nightly backup of the production database (HU-016, OPS-01).
#
# pg_dump -> encrypted with age (public key only, the private key never touches GitHub)
# -> uploaded to Cloudflare R2, a different provider than the database.
# Retention is a lifecycle rule on the bucket (see docs/operacion/puesta-en-marcha.md).
#
# If it fails, GitHub emails whoever last changed this file. Check the Actions tab weekly.
name: Backup

on:
  schedule:
    - cron: "17 6 * * *" # 03:17 in Argentina, when nobody is loading entries
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    # Skipped until the backup variables are set (docs/operacion/puesta-en-marcha.md, step 6).
    if: vars.R2_BUCKET != '' && vars.BACKUP_AGE_RECIPIENT != ''
    runs-on: ubuntu-latest
    environment: backup
    env:
      PG_MAJOR: ${{ vars.PG_MAJOR || '17' }}
    steps:
      - name: Install the PostgreSQL client and age
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-${PG_MAJOR}" age
          echo "/usr/lib/postgresql/${PG_MAJOR}/bin" >> "$GITHUB_PATH"

      - name: Dump and encrypt
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          name="cuadernos-$(date -u +%Y%m%d-%H%M%S).dump.age"
          pg_dump --format=custom --no-owner --no-privileges "$DATABASE_URL" \
            | age --recipient "$AGE_RECIPIENT" > "$name"
          size=$(stat -c %s "$name")
          if [ "$size" -lt 1024 ]; then echo "The backup is too small ($size bytes)." >&2; exit 1; fi
          echo "FILE=$name" >> "$GITHUB_ENV"
          echo "Backup $name, $size bytes" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 does not take every checksum header that new AWS CLI versions send by default.
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
          ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          aws s3 cp "$FILE" "s3://$BUCKET/daily/$FILE" --endpoint-url "$ENDPOINT" --only-show-errors
          # Read it back: an upload that cannot be listed does not count.
          aws s3 ls "s3://$BUCKET/daily/$FILE" --endpoint-url "$ENDPOINT"
