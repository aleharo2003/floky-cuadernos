name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The deploy workflow runs the same checks before publishing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cuadernos
          POSTGRES_USER: cuadernos
          POSTGRES_PASSWORD: cuadernos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cuadernos"
          --health-interval 3s
          --health-retries 20
    env:
      DJANGO_SECRET_KEY: ci-only-not-secret
      DJANGO_DEBUG: "1"
      DATABASE_URL: postgres://cuadernos:cuadernos@localhost:5432/cuadernos
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Types and build
        run: npm run build

  # The whole app in a real browser: Django serves the API and the React build (frontend/e2e).
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cuadernos
          POSTGRES_USER: cuadernos
          POSTGRES_PASSWORD: cuadernos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cuadernos"
          --health-interval 3s
          --health-retries 20
    env:
      DJANGO_SECRET_KEY: ci-only-not-secret
      DATABASE_URL: postgres://cuadernos:cuadernos@localhost:5432/cuadernos
      E2E_PYTHON: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Types of the tests
        run: npm run typecheck:e2e
        working-directory: frontend
      - name: Build the frontend
        run: npm run build
        working-directory: frontend
      - name: Database
        run: python manage.py migrate
        working-directory: backend
      - name: Browser tests
        run: npm run e2e
        working-directory: frontend
      # On failure: screenshots and a step by step trace of each failed test.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t floky-cuadernos:ci .
