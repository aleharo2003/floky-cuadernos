name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The deploy workflow runs the same checks before publishing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cuadernos
          POSTGRES_USER: cuadernos
          POSTGRES_PASSWORD: cuadernos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cuadernos"
          --health-interval 3s
          --health-retries 20
    env:
      DJANGO_SECRET_KEY: ci-only-not-secret
      DJANGO_DEBUG: "1"
      DATABASE_URL: postgres://cuadernos:cuadernos@localhost:5432/cuadernos
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Types and build
        run: npm run build

  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t floky-cuadernos:ci .
